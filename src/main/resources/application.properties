quarkus.application.name=shipday-integration
quarkus.http.port=8080

# --- Shipday ---
# The API key is NOT configured here: each request must send it in the X-Shipday-Api-Key header.
quarkus.rest-client.shipday-api.url=${SHIPDAY_BASE_URL:https://api.shipday.com}
quarkus.rest-client.shipday-api.connect-timeout=5000
quarkus.rest-client.shipday-api.read-timeout=15000

